[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topaz-em"
description = "Particle picking with positive-unlabeled CNNs"
readme = "README.md"
requires-python = ">=3.8,<=3.13"
license = { text = "GPLv3" }
authors = [
  { name = "Tristan Bepler", email = "tbepler@mit.edu" }
]
keywords = ["cryoEM", "particle-picking", "CNN", "positive-unlabeled", "denoise", "topaz"]
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]

# These fields are filled dynamically from files
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-timeout"]

[project.urls]
Homepage = "https://github.com/tbepler/topaz"

[project.scripts]
topaz = "topaz.main:main"

[tool.setuptools.dynamic]
version = {attr = "topaz.__version__"}
dependencies = { file = "requirements.txt" }

[tool.setuptools.packages.find]
include = ["topaz*"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-ra --strict-markers --import-mode=importlib"
timeout = 600
markers = [
  "smoke: L0, no data; imports, parsers, --help, CLI surface, model construction (auto-applied in test/smoke)",
  "unit: L1, pure numerics on in-code arrays (auto-applied in test/unit)",
  "io: L2, image and coordinate file formats (auto-applied in test/io)",
  "integration: L3, loaders and CLI runs on committed fixtures (auto-applied in test/integration)",
  "cli: exercises the installed `topaz` console script via subprocess",
  "differential: L5, comparisons against frozen v0.2.5 outputs (auto-applied in test/differential)",
  "slow: excluded from the all-Python CI legs; runs on the 3.11 leg only",
]
